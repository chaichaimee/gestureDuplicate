summary = "gestureDuplicate"
description = """Gesture Duplicate is a housekeeping tool for NVDA that scans and fixes conflicting keyboard gestures, manages custom add-on shortcuts, and cleans up stray configuration sections to keep your screen reader setup organized.

Hot Keys:
Shift+Windows+G
Single Tap : Check for duplicate input gestures
Double Tap : My Gestures Management
Tripple Tap : Clean Configuration"""