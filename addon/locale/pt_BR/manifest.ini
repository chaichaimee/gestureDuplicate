summary = "Duplicar gesto"
description = """O Duplicar Gesto é uma ferramenta de manutenção para o NVDA que examina e corrige gestos de teclado conflitantes, gerencia atalhos personalizados de complementos e limpa seções de configuração órfãs para manter a configuração do seu leitor de tela organizada.

Teclas de Atalho:
Shift+Windows+G
Um toque: Verificar gestos de entrada duplicados
Dois toques: Gerenciamento de Meus Gestos
Três toques: Limpar configuração"""