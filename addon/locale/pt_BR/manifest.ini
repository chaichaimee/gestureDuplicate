summary = "Duplicar gesto"
description = """Gesture Duplicate é uma ferramenta de manutenção para o NVDA que examina e corrige atalhos de teclado conflitantes, gerencia atalhos personalizados de complementos e limpa seções de configuração órfãs para manter a configuração do seu leitor de tela organizada.

Teclas de atalho:
Shift+Windows+G
Toque único: Verificar gestos de entrada duplicados
Toque duplo: Gerenciamento dos Meus Gestos
Toque triplo: Limpar configuração"""