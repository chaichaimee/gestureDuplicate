summary = "Dupliquer le geste"
description = """Gesture Duplicate est un outil de maintenance pour NVDA qui analyse et corrige les gestes clavier en conflit, gère les raccourcis personnalisés des extensions et nettoie les sections de configuration superflues pour garder votre lecteur d'écran organisé.

Raccourcis clavier :
Maj+Windows+G
Un seul appui : Rechercher les gestes d'entrée en double
Double appui : Gestion de mes gestes
Triple appui : Nettoyer la configuration"""