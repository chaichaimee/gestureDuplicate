summary = "Dupliquer le geste"
description = """Gesture Duplicate est un outil de maintenance pour NVDA qui analyse et corrige les raccourcis clavier en conflit, gère les raccourcis personnalisés des extensions et nettoie les sections de configuration obsolètes pour garder votre lecteur d'écran bien organisé.

Raccourcis clavier :
Maj+Windows+G
Appui simple : Vérifier les gestes d'entrée dupliqués
Double tap : Gestion de mes gestes
Triple appui : effacer la configuration"""