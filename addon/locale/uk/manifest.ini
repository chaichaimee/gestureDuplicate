summary = "Дублювання жестів"
description = """Дублювання жестів — це службовий інструмент для NVDA, який сканує та виправляє конфліктні жести клавіатури, керує власними скороченнями додатків та очищує зайві розділи конфігурації для підтримки порядку в налаштуваннях вашої програми читання з екрана.

Гарячі клавіші:
Shift+Windows+G
Один дотик: перевірити наявність дублюючих жестів введення
Подвійний дотик: керування моїми жестами
Потрійний дотик: очистити конфігурацію"""