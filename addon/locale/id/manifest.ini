summary = "Duplikat Gestur"
description = """Gesture Duplicate adalah alat pemeliharaan NVDA yang memindai dan memperbaiki konflik gestur papan ketik, mengelola pintasan pengaya kustom, dan membersihkan bagian konfigurasi yang tidak terpakai agar pengaturan pembaca layar Anda tetap teratur.

Tombol Pintas:
Shift+Windows+G
Ketukan Tunggal: Periksa gerakan masukan duplikat
Ketuk Dua Kali: Manajemen Gestur Saya
Ketuk Tiga Kali: Bersihkan Konfigurasi"""