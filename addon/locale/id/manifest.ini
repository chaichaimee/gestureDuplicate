summary = "Duplikat Gestura"
description = """Gesture Duplicate adalah alat pemeliharaan untuk NVDA yang memindai dan memperbaiki konflik gestur papan ketik, mengelola pintasan pengaya kustom, dan membersihkan bagian konfigurasi yang tidak terpakai agar pengaturan pembaca layar Anda tetap teratur.

Tombol Cepat:
Shift+Windows+G
Ketuk Sekali : Periksa gestur masukan yang duplikat
Ketuk Dua Kali : Pengelolaan Gestur Saya
Ketuk Tiga Kali : Bersihkan Konfigurasi"""