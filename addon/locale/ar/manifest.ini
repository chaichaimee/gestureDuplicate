summary = "نسخ الإيماءة"
description = """إيماءة مكررة هي أداة صيانة لقارئ الشاشة NVDA تفحص وتصلح إيماءات لوحة المفاتيح المتعارضة، وتدير اختصارات الإضافات المخصصة، وتُنظف أقسام التكوين الشاردة للحفاظ على تنظيم إعدادات قارئ الشاشة الخاص بك.

اختصارات لوحة المفاتيح:
Shift+Windows+G
نقرة واحدة: التحقق من إيماءات الإدخال المكررة
نقرة مزدوجة: إدارة إيماءاتي
النقر الثلاثي: إعدادات نظيفة"""