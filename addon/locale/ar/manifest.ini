summary = "تكرار الإيماءة"
description = """تكرار الإيماءة هي أداة صيانة لقارئ الشاشة NVDA تفحص وتصلح إيماءات لوحة المفاتيح المتعارضة، وتدير اختصارات الإضافات المخصصة، وتُنظف أقسام الإعدادات المهملة للحفاظ على تنظيم إعدادات قارئ الشاشة الخاص بك.

مفاتيح الاختصار:
Shift+Windows+G
نقرة واحدة: التحقق من إيماءات الإدخال المكررة
نقرة مزدوجة: إدارة إيماءاتي
ثلاث نقرات: تنظيف الإعدادات"""