summary = "โคลนคีย์ลัด"
description = """การโคลนคีย์ลัดคือเครื่องมือดูแลระบบสำหรับ NVDA ที่ช่วยสแกนและแก้ไขปัญหาคีย์ลัดบนแป้นพิมพ์ที่ซ้ำซ้อน จัดการทางลัดส่วนเสริมที่กำหนดเอง และล้างส่วนการกำหนดค่าที่ตกค้างเพื่อให้การตั้งค่าโปรแกรมอ่านหน้าจอของคุณเป็นระเบียบ

คีย์ลัด:
Shift+Windows+G
แตะครั้งเดียว: ตรวจสอบอินพุตคีย์ลัดที่ซ้ำกัน
แตะสองครั้ง: การจัดการคีย์ลัดของฉัน
แตะสามครั้ง: ล้างการกำหนดค่า"""