summary = "जेस्चर डुप्लीकेट"
description = """जेस्चर डुप्लीकेट एनवीडीए के लिए एक हाउसकीपिंग टूल है जो कॉन्फ़्लिक्टिंग कीबोर्ड जेस्चर को स्कैन और ठीक करता है, कस्टम ऐड-ऑन शॉर्टकट प्रबंधित करता है, और आपके स्क्रीन रीडर सेटअप को व्यवस्थित रखने के लिए अतिरिक्त कॉन्फ़िगरेशन सेक्शन को साफ करता है।

हॉटकीज़:
Shift+Windows+G
सिंगल टैप: डुप्लिकेट इनपुट जेस्चर की जाँच करें
डबल टैप : मेरे जेस्चर प्रबंधन
ट्रiple टैप: कॉन्फ़िगरेशन साफ़ करें"""