summary = "Duplicar gesto"
description = """Gesture Duplicate es una herramienta de mantenimiento para NVDA que busca y corrige gestos de teclado en conflicto, administra atajos personalizados de complementos y limpia secciones de configuración huérfanas para mantener organizada la configuración de su lector de pantalla.

Teclas de acceso rápido:
Mayús+Windows+G
Un toque : Comprobar gestos de entrada duplicados
Doble toque : Gestión de mis gestos
Triple toque : Limpiar configuración"""