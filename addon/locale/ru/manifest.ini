summary = "Дублировать жест"
description = """Дублирование жестов — это служебный инструмент NVDA, который сканирует и исправляет конфликтующие комбинации клавиш, управляет пользовательскими сокращениями дополнений и очищает лишние разделы конфигурации, помогая поддерживать порядок в настройках программы чтения с экрана.

Горячие клавиши:
Shift+Windows+G
Одиночное нажатие: Проверить на наличие дублирующихся жестов ввода
Двойное нажатие: Управление моими жестами
Тройное нажатие: Очистить конфигурацию"""