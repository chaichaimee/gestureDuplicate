summary = "Дублировать жест"
description = """Gesture Duplicate — это утилита для обслуживания NVDA, которая сканирует и исправляет конфликтующие комбинации клавиш, управляет пользовательскими сочетаниями клавиш надстроек и очищает лишние разделы конфигурации для поддержания порядка в настройках вашей программы чтения с экрана.

Горячие клавиши:
Shift+Windows+G
Одиночное касание: Проверять повторяющиеся жесты ввода
Двойное касание: Управление моими жестами
Тройное касание: очистить конфигурацию"""