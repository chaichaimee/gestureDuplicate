summary = "ทำซ้ำท่าทาง"
description = """Gesture Duplicate เป็นเครื่องมือจัดการสำหรับ NVDA ที่ทำหน้าที่สแกนและแก้ไขแป้นพิมพ์ลัดที่ซ้ำซ้อน จัดการทางลัดส่วนเสริมที่กำหนดเอง และทำความสะอาดส่วนการกำหนดค่าที่ตกค้าง เพื่อช่วยจัดระเบียบการตั้งค่าโปรแกรมอ่านหน้าจอของคุณ

ปุ่มลัด:
Shift+Windows+G
แตะครั้งเดียว: ตรวจสอบท่าทางคำสั่งซ้ำ
แตะสองครั้ง : การจัดการท่าทางสัมผัสของฉัน
แตะสามครั้ง: ล้างการกำหนดค่า"""