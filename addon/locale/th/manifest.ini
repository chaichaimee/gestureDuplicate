summary = "ทำซ้ำท่าทาง"
description = """Gesture Duplicate เป็นเครื่องมือจัดการสำหรับ NVDA ที่ช่วยสแกนและแก้ไขข้อขัดแย้งของแป้นพิมพ์ลัด จัดการทางลัดเสริม และทำความสะอาดส่วนกำหนดค่าที่ตกค้างเพื่อให้การตั้งค่าโปรแกรมอ่านหน้าจอของคุณเป็นระเบียบ

แป้นพิมพ์ลัด:
Shift+Windows+G
แตะครั้งเดียว : ตรวจสอบท่าทางอินพุตที่ซ้ำกัน
แตะสองครั้ง : จัดการท่าทางของฉัน
แตะสามครั้ง : ล้างข้อมูลการกำหนดค่า"""