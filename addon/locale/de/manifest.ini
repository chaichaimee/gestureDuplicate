summary = "Gestduplikat"
description = """Gesture Duplicate ist ein Verwaltungswerkzeug für NVDA, das konfliktreiche Tastenkombinationen sucht und behebt, benutzerdefinierte Add-on-Kurzbefehle verwaltet und verwaiste Konfigurationsabschnitte bereinigt, um Ihre Screenreader-Einrichtung übersichtlich zu halten.

Tastenkombinationen:
Umschalt+Windows+G
Einfach tippen: Auf doppelte Eingabegesten prüfen
Doppelt tippen: Verwaltung eigener Gesten
Dreifach tippen: Konfiguration bereinigen"""