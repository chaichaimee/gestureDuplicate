summary = "Tastenkombination duplizieren"
description = """Gesture Duplicate ist ein Wartungswerkzeug für NVDA, das kollidierende Tastaturkürzel scannt und behebt, benutzerdefinierte Add-On-Kurzbefehle verwaltet und verwaiste Konfigurationsabschnitte bereinigt, um Ihre Screenreader-Einrichtung übersichtlich zu halten.

Tastenkombinationen:
Shift+Windows+G
Einzelnes Tippen: Auf doppelte Eingabebefehle prüfen
Doppelstöckiges Tippen: Meine Gestenverwaltung
Dreifachtipp: Konfiguration bereinigen"""